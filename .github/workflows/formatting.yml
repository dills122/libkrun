name: Code Formatting
on: [pull_request]

jobs:
  formatting:
    name: clang-format + cargo fmt
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: C code formatting
        run: find init -iname '*.h' -o -iname '*.c' | xargs clang-format -n -Werror
      
      - name: Install governed formatting toolchain
        if: github.base_ref == 'capsule/upstream-v1.19.4'
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Rust code formatting (governed profile)
        if: github.base_ref == 'capsule/upstream-v1.19.4'
        run: governance/capsule-v1.19.4/scripts/verify-cargo-fmt.sh

      - name: Rust code formatting
        if: github.base_ref != 'capsule/upstream-v1.19.4'
        run: cargo fmt -- --check
      
      - name: Rust code formatting (examples)
        run: cd examples; cargo fmt -- --check
      
      - name: Rust code formatting (tests)
        run: cd tests; cargo fmt -- --check
